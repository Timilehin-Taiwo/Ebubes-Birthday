<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<title>28 Stops — A Birthday Journey</title>
<style>
:root{--pink:#ffd9e6;--pink2:#ffc2d8;--ink:#5b2a48;--rose:#ff6fa5;--gold:#ffb84d;--mint:#7fd6c2;
--hand:"Patrick Hand","Segoe Print","Bradley Hand","Chalkboard SE","Comic Neue","Comic Sans MS",cursive;
--round:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#f7b9d0;overflow:hidden;font-family:var(--round);color:var(--ink);touch-action:manipulation}
#app{position:fixed;top:0;bottom:0;left:50%;width:min(100vw,520px);transform:translateX(-50%);overflow:hidden;background-color:var(--pink);
background-image:radial-gradient(circle at 22px 22px,rgba(255,255,255,.45) 3px,transparent 4px);background-size:44px 44px}
svg{display:block}
button{font-family:inherit;color:var(--ink);cursor:pointer}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .9s ease,transform .9s ease;transform:scale(1.05);z-index:1}
.scene.active{opacity:1;pointer-events:auto;transform:none}
.hand{font-family:var(--hand)}

/* controls */
#arrow{position:absolute;right:18px;bottom:22px;width:68px;height:68px;border-radius:50%;border:3px solid var(--ink);background:#fff;
box-shadow:4px 4px 0 var(--ink);z-index:10;display:grid;place-items:center;opacity:0;transform:scale(.4);pointer-events:none;transition:.4s cubic-bezier(.3,1.6,.5,1)}
#arrow.show{opacity:1;transform:none;pointer-events:auto}
#arrow svg{animation:nudge 1.1s ease-in-out infinite}
#arrow:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
@keyframes nudge{50%{transform:translateX(6px)}}
#mute{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;z-index:10;display:grid;place-items:center;padding:0}
#bar{position:absolute;left:10px;top:12px;z-index:12;display:none;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 70px)}
body.edit #bar{display:flex}
#bar input,#bar button{height:34px;border:2.5px solid var(--ink);border-radius:17px;background:#fff;padding:0 12px;font-size:13px;font-family:inherit;color:var(--ink)}
#bar input{width:96px}
#chip{position:absolute;left:16px;bottom:34px;z-index:9;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:6px 14px;font-size:14px;box-shadow:3px 3px 0 var(--ink);opacity:0;transition:.4s}
#chip.show{opacity:1}
#hint{position:absolute;left:50%;bottom:112px;transform:translateX(-50%) translateY(10px);z-index:9;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:9px 16px;font-size:15px;opacity:0;transition:.4s;white-space:nowrap;pointer-events:none}
#hint.show{opacity:1;transform:translateX(-50%);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{margin-bottom:6px}}

/* start */
#start{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#start h1{font-size:34px;margin:0;line-height:1.1}
#start p{margin:0;font-size:17px;opacity:.85}
.big{border:3px solid var(--ink);background:#fff;border-radius:34px;padding:16px 34px;font-size:20px;box-shadow:5px 5px 0 var(--ink);animation:pulseBtn 1.6s ease-in-out infinite}
.big:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
@keyframes pulseBtn{50%{transform:scale(1.06)}}
.seedsvg{animation:bob2 2s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-8px)}}

/* bloom */
#bloom::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 62%,rgba(255,240,190,.95),rgba(255,217,230,0) 62%);opacity:0}
#bloom.play::before{animation:fadeIn 4s 5.4s forwards}
@keyframes fadeIn{to{opacity:1}}
#bloom svg.full{position:absolute;inset:0;width:100%;height:100%}
.cap{position:absolute;left:0;right:0;text-align:center;opacity:0;padding:0 24px}
#bloom .t1{top:7%;font-size:38px;line-height:1.1}
#bloom .t2{bottom:17%;font-size:19px;line-height:1.4}
#bloom.play .t1{animation:fadeUp 1.4s 7s forwards}
#bloom.play .t2{animation:fadeUp 1.4s 9s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#bloom .seed{transform-origin:200px 548px}
#bloom.play .seed{animation:wig .8s ease-in-out 2 }
@keyframes wig{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
#bloom .stem{stroke-dasharray:1;stroke-dashoffset:1}
#bloom.play .stem{animation:grow 3.2s .8s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes grow{to{stroke-dashoffset:0}}
#bloom .leaf{transform:scale(0);transform-origin:0 0}
#bloom.play .leaf.a{animation:pop .8s 2.2s forwards}
#bloom.play .leaf.b{animation:pop .8s 3s forwards}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
#bloom .bud{transform:scale(0);transform-origin:200px 336px}
#bloom.play .bud{animation:budA 1.2s 3.7s forwards}
@keyframes budA{0%{transform:scale(0);opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(1.2);opacity:0}}
#bloom .petal{transform:scale(0);transform-origin:0 0}
#bloom.play .petal{animation:pop .9s forwards}
#bloom .ctr{transform:scale(0);transform-origin:200px 322px}
#bloom.play .ctr{animation:pop .8s 5.9s forwards}
#bloom .head{transform-origin:200px 336px}
#bloom.play .head{animation:swayH 4s 7s ease-in-out infinite alternate}
@keyframes swayH{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
#bloom .sunmove{transform:translateY(340px)}
#bloom.play .sunmove{animation:rise 4.2s 5.2s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes rise{to{transform:translateY(0)}}
.rays{animation:spin 40s linear infinite;transform-origin:0 0}
@keyframes spin{to{transform:rotate(360deg)}}
.twinkle{opacity:0;transform-origin:0 0}
#bloom.play .twinkle{animation:tw 2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.float{position:absolute;pointer-events:none;z-index:3}

/* age */
#age{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px;text-align:center}
#age h2{font-size:30px;margin:0;line-height:1.15}
.machine{position:relative;background:#fff;border:4px solid var(--ink);border-radius:34px;padding:44px 26px 26px;box-shadow:7px 7px 0 var(--ink)}
.bulbs{position:absolute;top:12px;left:18px;right:18px;display:flex;justify-content:space-between}
.bulbs i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;animation:bulb 1s infinite}
.bulbs i:nth-child(odd){animation-delay:.5s}
@keyframes bulb{50%{background:var(--gold)}}
.win{display:flex;gap:14px;position:relative}
.reel{width:104px;height:120px;overflow:hidden;border:3.5px solid var(--ink);border-radius:20px;background:#fff7fb;position:relative}
.strip div{height:120px;line-height:120px;font-size:92px;font-weight:700;text-align:center}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(#fff 0,transparent 22%,transparent 78%,#fff 100%);opacity:.7;pointer-events:none}
.pointer{position:absolute;top:50%;width:0;height:0;border:11px solid transparent}
.pointer.l{left:-25px;border-left-color:var(--ink);transform:translateY(-50%)}
.pointer.r{right:-25px;border-right-color:var(--ink);transform:translateY(-50%)}
#ageNote{font-size:22px;min-height:60px;opacity:0}
#ageNote.show{animation:fadeUp .8s forwards}
.machine.shake{animation:shk .5s}
@keyframes shk{20%{transform:rotate(-2deg) scale(1.04)}60%{transform:rotate(2deg) scale(1.04)}}
#burst,.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}

/* map */
#scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#scroller::-webkit-scrollbar{display:none}
#mapSvg{width:100%;height:auto}
.node{cursor:pointer}
.node .base{fill:#fff;stroke:var(--ink);stroke-width:3.5}
.node text{font-family:var(--round);font-weight:700;font-size:26px;fill:var(--ink);text-anchor:middle;pointer-events:none}
.node.locked .base{fill:#fff3f8;stroke-dasharray:5 5}
.node.locked text{opacity:.55}
.node .pulse{fill:none;stroke:var(--rose);stroke-width:4;opacity:0}
.node.next .pulse{animation:ring 1.3s ease-out infinite}
.node.next .base{fill:#fff0a8}
.node.next .ni{animation:wobble 1.1s ease-in-out infinite;transform-origin:0 0}
@keyframes ring{0%{r:30;opacity:.9}100%{r:52;opacity:0}}
@keyframes wobble{50%{transform:scale(1.1)}}
.node.done .base{fill:var(--rose)}
.node.done text{fill:#fff}
.node.has .base{fill:#c9f2e6}
.node .stars{display:none}.node.done .stars{display:block}
.sway{animation:sway 3.6s ease-in-out infinite alternate;transform-origin:0 0}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.drift{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.wspin{animation:spin .5s linear infinite paused;transform-origin:0 0}
.driving .wspin{animation-play-state:running}
.cartext{font-family:var(--round);font-weight:800;font-style:italic;font-size:24px;fill:#fff;stroke:var(--ink);stroke-width:5;paint-order:stroke;stroke-linejoin:round;text-anchor:middle}

/* modal */
#modal{position:absolute;inset:0;z-index:20;background:rgba(91,42,72,.3);display:none;padding:34px 18px 18px;overflow-y:auto}
#modal.show{display:flex}
#card{position:relative;background:#fff;border:3.5px solid var(--ink);border-radius:26px;box-shadow:7px 7px 0 var(--ink);width:100%;max-width:380px;margin:auto;padding:34px 20px 20px;animation:popIn .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes popIn{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.ribbon{position:absolute;top:-1px;left:50%;transform:translate(-50%,-50%);background:var(--rose);color:#fff;border:3px solid var(--ink);border-radius:20px;padding:6px 22px;font-size:17px;white-space:nowrap}
.polaroid{position:relative;background:#fff;border:3px solid var(--ink);padding:8px 8px 26px;transform:rotate(-2deg);margin:6px 8px 18px;box-shadow:3px 3px 0 rgba(91,42,72,.25)}
.polaroid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border:2px solid var(--ink)}
.polaroid .ph{aspect-ratio:4/3;border:2.5px dashed var(--ink);display:none;place-items:center;font-size:14px}
.tape{position:absolute;top:-13px;left:50%;width:84px;height:24px;transform:translateX(-50%) rotate(-5deg);background:rgba(255,111,165,.55);border:2px dashed var(--ink)}
.msg{font-family:var(--hand);font-size:19px;line-height:1.55;margin:0 4px 16px;white-space:pre-wrap;max-height:30vh;overflow:auto;text-align:center}
#mEdit{display:none;width:100%;min-height:130px;border:3px solid var(--ink);border-radius:14px;padding:10px;font:17px/1.5 var(--hand);color:var(--ink);resize:vertical;margin-bottom:12px}
.edit-only{display:none}
body.edit .edit-only{display:inline-block}
body.edit #mEdit{display:block}
body.edit .msg{display:none}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pill{border:3px solid var(--ink);background:#fff;border-radius:22px;padding:9px 18px;font-size:15px}
.go{border:3px solid var(--ink);background:var(--rose);color:#fff;border-radius:26px;padding:12px 26px;font-size:18px;box-shadow:4px 4px 0 var(--ink);display:inline-flex;gap:8px;align-items:center}
.go:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}

/* final */
#final svg.full{position:absolute;inset:0;width:100%;height:100%}
#final .ft{position:absolute;left:0;right:0;top:6%;text-align:center;padding:0 20px;opacity:0}
#final .ft h1{font-size:34px;line-height:1.12;margin:0 0 10px}
#final .ft p{font-size:19px;margin:0}
#final .fb{position:absolute;left:0;right:0;bottom:26px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;opacity:0;padding:0 14px}
#final.done .ft{animation:fadeUp 1.2s forwards}
#final.done .fb{animation:fadeUp 1.2s 1.6s forwards}
#final .dl,#final .dr{transition:transform 1.2s cubic-bezier(.3,1,.4,1)}
#final .dl{transform-origin:280px 520px}
#final .dr{transform-origin:330px 520px}
#final.open .dl,#final.open .dr{transform:scaleX(.1)}
</style>
</head>
<body>
<div id="app">

  <div id="bar">
    <input id="nameIn" placeholder="Her name" aria-label="Her name">
    <button id="bPrev">Preview</button>
    <button id="bFinal">Finale</button>
    <button id="bExport">Export</button>
  </div>
  <button id="mute" aria-label="Sound">
    <svg id="muteIcon" width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#5b2a48" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h4l6-5v16l-6-5H4z"/><path class="w" d="M18 9c2 2 2 6 0 8"/><path class="w" d="M21 6c4 4 4 10 0 14"/><path class="x" d="M18 10l6 6M24 10l-6 6" style="display:none"/></svg>
  </button>
  <button id="arrow" aria-label="Next">
    <svg width="38" height="38" viewBox="0 0 38 38" fill="none" stroke="#5b2a48" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19h24M21 9l10 10-10 10"/></svg>
  </button>
  <div id="chip">Stop 0 / 28</div>
  <div id="hint"></div>

  <!-- START -->
  <section id="start" class="scene active">
    <svg class="seedsvg" width="150" height="120" viewBox="0 0 150 120" fill="none" stroke="#5b2a48" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 96Q75 56 138 96"/><path d="M4 96H146"/>
      <ellipse cx="75" cy="76" rx="9" ry="13" fill="#ffe08a" transform="rotate(-10 75 76)"/>
      <path d="M75 62V50M75 50c-8-2-12-8-12-14 8 0 12 5 12 14zM75 50c8-2 12-8 12-14-8 0-12 5-12 14z" stroke-width="2.6"/>
    </svg>
    <h1 class="hand">A journey for <span class="nm">you</span></h1>
    <p>28 years. 28 stops. One pink car.</p>
    <button class="big" id="beginBtn">Tap to begin</button>
  </section>

  <!-- BLOOM -->
  <section id="bloom" class="scene">
    <svg class="full" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice">
      <defs><clipPath id="sky"><rect x="-300" y="-300" width="1000" height="856"/></clipPath></defs>
      <g clip-path="url(#sky)"><g transform="translate(200 300)"><g class="sunmove"><g class="rays" stroke="#ffb84d" stroke-width="4" stroke-linecap="round" id="rayG"></g>
        <circle r="74" fill="#fff4c4" stroke="#5b2a48" stroke-width="3.5"/>
        <path d="M-34 8Q0 34 34 8" fill="none" stroke="#5b2a48" stroke-width="3" stroke-linecap="round"/>
        <circle cx="-24" cy="-12" r="3.5" fill="#5b2a48"/><circle cx="24" cy="-12" r="3.5" fill="#5b2a48"/>
      </g></g></g>
      <rect x="-300" y="556" width="1000" height="400" fill="#ffc2d8"/>
      <g fill="none" stroke="#5b2a48" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-300 556H700"/>
        <path d="M110 556Q200 516 290 556" fill="#ffd9e6"/>
        <g id="grass"></g>
        <ellipse class="seed" cx="200" cy="548" rx="7" ry="10" fill="#ffe08a"/>
        <path class="stem" pathLength="1" d="M200 548C196 500 206 430 200 340"/>
        <g transform="translate(199 480)"><path class="leaf a" d="M0 0C-40-6-66-30-74-62C-34-64-4-40 0 0Z" fill="#cff3e6"/></g>
        <g transform="translate(201 430) scale(-1 1)"><path class="leaf b" d="M0 0C-40-6-66-30-74-62C-34-64-4-40 0 0Z" fill="#cff3e6"/></g>
        <g class="head">
          <ellipse class="bud" cx="200" cy="334" rx="14" ry="20" fill="#ff9ec4"/>
          <g id="petalsB"></g><g id="petalsF"></g>
          <g class="ctr"><circle cx="200" cy="322" r="17" fill="#ffe08a"/><circle cx="194" cy="318" r="2" fill="#5b2a48" stroke="none"/><circle cx="206" cy="318" r="2" fill="#5b2a48" stroke="none"/><circle cx="200" cy="328" r="2" fill="#5b2a48" stroke="none"/></g>
        </g>
        <g id="sparks"></g>
      </g>
    </svg>
    <div class="cap t1 hand">Happy Birthday,<br><span class="nm">you</span>!</div>
    <div class="cap t2">Come with me on this exciting journey of your life…</div>
  </section>

  <!-- AGE -->
  <section id="age" class="scene">
    <h2 class="hand">How old are you today?</h2>
    <div class="machine" id="machine">
      <div class="bulbs"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="win"><div class="pointer l"></div>
        <div class="reel"><div class="strip" id="s1"></div></div>
        <div class="reel"><div class="strip" id="s2"></div></div>
      <div class="pointer r"></div></div>
    </div>
    <div id="ageNote" class="hand">Twenty-eight.<br>And just look at you.</div>
    <div id="burst"></div>
  </section>

  <!-- MAP -->
  <section id="map" class="scene">
    <div id="scroller"><svg id="mapSvg"></svg></div>
  </section>

  <!-- FINAL -->
  <section id="final" class="scene">
    <svg class="full" id="finalSvg" viewBox="0 0 400 700" preserveAspectRatio="xMidYMax slice"></svg>
    <div class="ft"><h1 class="hand">Your last birthday<br>as a Miss</h1><p class="hand">Next year, we celebrate as husband &amp; wife.</p></div>
    <div class="fb"><button class="go" id="noteBtn">Read my final note</button><button class="pill" id="replayBtn">Replay the journey</button></div>
    <div class="fx" id="finalFx"></div>
  </section>

  <!-- MODAL -->
  <div id="modal"><div id="card">
    <div class="ribbon" id="mTitle">Stop 1</div>
    <div class="polaroid" id="mPhoto"><div class="tape"></div><img id="mImg" alt=""><div class="ph" id="mPh">Add a photo</div></div>
    <p class="msg" id="mText"></p>
    <textarea id="mEdit" placeholder="Write something beautiful for this stop…"></textarea>
    <input type="file" id="mFile" accept="image/*" hidden>
    <div class="row" style="margin-bottom:14px">
      <button class="pill edit-only" id="mAdd">Add / change photo</button>
      <button class="pill edit-only" id="mRem">Remove photo</button>
    </div>
    <div class="row"><button class="go" id="mDone"><span id="mDoneT">Keep driving</span>
      <svg width="22" height="22" viewBox="0 0 38 38" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19h24M21 9l10 10-10 10"/></svg></button></div>
  </div></div>
</div>

<script type="application/json" id="giftdata">{}</script>
<script>
(function(){
"use strict";
const SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const INK='#5b2a48', ROSE='#ff6fa5';
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const hashMode=location.hash==='#edit'?'edit':location.hash==='#preview'?'preview':'view';
const EDIT=hashMode==='edit';
if(EDIT) document.body.classList.add('edit');

/* ---------- data ---------- */
let data={};
try{data=JSON.parse($('#giftdata').textContent||'{}')||{};}catch(e){data={};}
data.levels=data.levels||{}; data.final=data.final||{};
const mem={};
const idb={
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('bday28',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});},
  async get(k){try{const db=await this.open();return await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined);});}catch(e){return mem[k];}},
  async set(k,v){mem[k]=v;try{const db=await this.open();await new Promise(res=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res();});}catch(e){}}
};
const saveDraft=()=>idb.set('draft',data);
const nameOf=()=>(data.name||'Ebube');
function applyName(){document.querySelectorAll('.nm').forEach(n=>n.textContent=nameOf());}

/* ---------- audio ---------- */
let ac,master,muted=false,musicMode=null,music=null;
function initAudio(){
  if(ac)return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  ac=new AC(); master=ac.createGain(); master.gain.value=.9; master.connect(ac.destination);
}
function tone(f,t0,dur,type,vol,glide){
  if(!ac)return; const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  if(glide)o.frequency.exponentialRampToValueAtTime(glide,t0+dur);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol||.15,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+.05);
}
const T=()=>ac?ac.currentTime:0;
const sfx={
  tick(){tone(880+Math.random()*80,T(),.05,'square',.035);},
  bing(){[1046,1318,1568,2093].forEach((f,i)=>tone(f,T()+i*.08,.7,'triangle',.16));},

      const a=posAt(L),b=posAt(Math.max(0,Math.min(road.getTotalLength(),L+dir*22)));
      const dx=b.x-a.x,dy=b.y-a.y;
      if(Math.abs(dx)>3)face=dx>0?1:-1;
      const tl=Math.max(-22,Math.min(22,face*Math.atan2(dy,Math.abs(dx))*180/Math.PI));
      tilt+=(tl-tilt)*.18;
      const bobY=-Math.abs(Math.sin((now-t0)/85))*3.5;
      setPose(rig,a.x,a.y+8,face,tilt,bobY,1);
      if(now-lastPuff>75){lastPuff=now;puff(puffLayer,a.x-face*62,a.y-8,face,false);if(Math.random()<.35)speedLines(puffLayer,a.x,a.y-12,face);}
      cameraTo(a.y);
      if(t<1)requestAnimationFrame(f);
      else{svgEl.classList.remove('driving');squash(rig,[.88,1.14],[1.1,.92]);sfx.ta();cartoon(puffLayer,'TA-DA!',rig.x,rig.y-70);
        for(let i=0;i<3;i++)puff(puffLayer,rig.x+face*58,rig.y-6,-face,true);res();}
    })(performance.now());
  });
}
async function goTo(i){
  if(busy)return;busy=true;$('#hint').classList.remove('show');
  const dist=Math.abs(lens[i]-lens[cur]);
  await drive(lens[cur],lens[i],Math.max(900,Math.min(2600,dist*9)));
  cur=i;refreshMap();busy=false;
  await sleep(350);openModal(i);
}
function nodeTap(i){
  if(busy)return;
  if(EDIT){goTo(i);return;}
  if(i<=prog){openModal(i,true);return;}
  if(i===prog+1){goTo(i);return;}
  const n=document.querySelector(`.node[data-i="${i}"]`);n.querySelector('.ni').animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:260});
  showHint('Finish the stops in order, my love');
}
function showHint(t){const h=$('#hint');h.textContent=t;h.classList.add('show');clearTimeout(showHint.t);showHint.t=setTimeout(()=>h.classList.remove('show'),2600);}
function enterMap(){
  go('map');duckMusic();
  if(!mapReady)buildMap();
  scale=$('#mapSvg').clientWidth/400;
  placeCar(lens[cur],1);refreshMap();
  requestAnimationFrame(()=>{cameraTo(pts[cur].y);});
  if(!EDIT&&prog<NL)later(()=>showHint(cur===0?'Tap the glowing stop (or the car) to drive!':'Tap the glowing stop to keep going!'),1200);
  if(EDIT)later(()=>showHint('Tap any stop to write its message'),1000);
}

/* ---------- modal ---------- */
let openIdx=null,viewOnly=false;
function lvlData(i){return i==='final'?data.final:(data.levels[i]=data.levels[i]||{});}
function openModal(i,only){
  openIdx=i;viewOnly=!!only;
  const d=(i==='final'?data.final:data.levels[i])||{};
  $('#mTitle').textContent=i==='final'?'From me, to you':(i===NL?`Stop ${NL} · The final one`:`Stop ${i}`);
  $('#mText').textContent=d.msg||'Something special goes here…';
  $('#mEdit').value=d.msg||'';
  setPhoto(d.img);
  $('#mDoneT').textContent=EDIT?'Save & close':(only?'Close':(i===NL?'Take me to the finale':(i==='final'?'Close':'Keep driving')));
  $('#modal').classList.add('show');sfx.pop();
}
function setPhoto(src){
  const im=$('#mImg');const has=!!src;
  if(has){im.src=src;im.style.display='block';}else{im.removeAttribute('src');im.style.display='none';}
  $('#mPh').style.display=(!has&&EDIT)?'grid':'none';
  $('#mPhoto').style.display=(has||EDIT)?'block':'none';
  $('#mRem').style.display=(EDIT&&has)?'inline-block':'none';
}
$('#mEdit').addEventListener('input',()=>{if(!EDIT||openIdx==null)return;lvlData(openIdx).msg=$('#mEdit').value;saveDraft();});
$('#mAdd').onclick=()=>$('#mFile').click();
$('#mPh').onclick=()=>{if(EDIT)$('#mFile').click();};
$('#mRem').onclick=()=>{lvlData(openIdx).img='';setPhoto('');saveDraft();};
$('#mFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const url=await shrink(f);lvlData(openIdx).img=url;setPhoto(url);saveDraft();e.target.value='';
};
function shrink(file){
  return new Promise(res=>{
    const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
      const m=900,s=Math.min(1,m/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.76));};im.src=r.result;};r.readAsDataURL(file);
  });
}
$('#mDone').onclick=async()=>{
  const i=openIdx;$('#modal').classList.remove('show');
  if(EDIT){ if(i==='final')return; refreshMap(); return; }
  if(viewOnly||i==='final')return;
  if(i>prog){prog=i;try{localStorage.setItem(PKEY,String(prog));}catch(e){}}
  refreshMap();
  if(i===NL){await sleep(300);runFinal();return;}
  cameraTo(pts[cur].y);
  later(()=>showHint('Tap the glowing stop to keep going!'),1500);
};

/* ---------- FINAL ---------- */
let frig,fbuilt=false,fpuff;
function buildFinal(){
  const svg=$('#finalSvg');svg.innerHTML='';
  const sc=el('g',{},svg);
  sc.innerHTML=`<rect x="-300" y="560" width="1000" height="400" fill="#ffc2d8"/>
  <g ${LA}>
   <g transform="translate(335 235)"><g class="rays" style="animation-duration:50s">${[...Array(12)].map((_,i)=>{const a=i*30*Math.PI/180;return `<path d="M${Math.cos(a)*44} ${Math.sin(a)*44}L${Math.cos(a)*62} ${Math.sin(a)*62}" stroke="#ffb84d"/>`}).join('')}</g><circle r="34" fill="#fff4c4"/></g>
   <g class="drift" transform="translate(70 235)"><path d="${CLOUDP}" fill="#fff" transform="scale(2)"/></g>
   <g class="drift" transform="translate(180 210)"><path d="${CLOUDP}" fill="#fff" transform="scale(1.3)"/></g>
   <path d="M-300 560H700"/><path d="M-300 600H700" stroke-dasharray="14 16" opacity=".6"/>
   <g class="sway" transform="translate(40 560)"><path d="M0 0V-34"/><path d="M-26-30C-40-62-12-92 0-74C12-92 40-62 26-30Z" fill="#cff3e6"/></g>
   <path d="M287 402V346L305 316 323 346V402" fill="#fff"/>
   <path d="M298 380v-14a7 7 0 0 1 14 0v14"/>
   <path d="M232 560V448H378V560" fill="#fff"/>
   <path d="M222 448L305 382 388 448Z" fill="#ff9ec4"/>
   <g transform="translate(305 302)"><path d="${HEART}" transform="scale(1.1)" fill="${ROSE}"/></g>
   <path d="M305 312V296" />
   <path d="M246 522V494a10 10 0 0 1 20 0V522Z" fill="#fff4c4"/><path d="M344 522V494a10 10 0 0 1 20 0V522Z" fill="#fff4c4"/>
   <circle cx="305" cy="463" r="10" fill="#fff"/><path d="M305 453V473M295 463H315"/>
   <path d="M280 560V510Q305 478 330 510V560Z" fill="#fff4c4"/>
   <path class="dl" d="M280 560V510Q293 496 305 492V560Z" fill="#ffb3d1"/>
   <path class="dr" d="M305 492Q317 496 330 510V560H305Z" fill="#ffb3d1"/>
   <path d="M262 566H348M254 574H356" stroke-width="2.4"/>
   <g id="bunting"></g>
   <g transform="translate(206 560)"><g class="sway"><path d="M0 0Q-4-60 4-120"/>
     <ellipse cx="4" cy="-142" rx="17" ry="21" fill="#ffb3d1"/><ellipse cx="-14" cy="-118" rx="14" ry="18" fill="#fff" transform="translate(0 4)"/><ellipse cx="22" cy="-112" rx="13" ry="17" fill="#fff4c4"/></g></g>
  </g>`;
  // bunting
  const bg=sc.querySelector('#bunting');const P0={x:40,y:500},P1={x:140,y:570},P2={x:232,y:456};
  const q=t=>({x:(1-t)*(1-t)*P0.x+2*(1-t)*t*P1.x+t*t*P2.x,y:(1-t)*(1-t)*P0.y+2*(1-t)*t*P1.y+t*t*P2.y});
  let bd=`M${P0.x} ${P0.y}Q${P1.x} ${P1.y} ${P2.x} ${P2.y}`;let fl='';
  for(let k=1;k<9;k++){const p=q(k/9);fl+=`<path d="M${p.x-9} ${p.y-1}L${p.x+9} ${p.y-1}L${p.x} ${p.y+17}Z" fill="${k%2?'#ff9ec4':'#fff'}" stroke-width="2.4"/>`;}
  bg.innerHTML=`<path d="${bd}"/>${fl}`;
  fpuff=el('g',{},svg);frig=makeRig(svg);fbuilt=true;
}
let fsceneTimer=null;
async function runFinal(){
  duckMusic();go('final');
  $('#final').classList.remove('done','open');
  if(!fbuilt)buildFinal();
  const host=$('#finalFx');host.innerHTML='';
  setPose(frig,-90,560,1,0,0,1.1);
  await sleep(1300);
  const svgEl=$('#finalSvg');svgEl.classList.add('driving');
  sfx.vroom();
  const t0=performance.now(),ms=3600,x0=-90,x1=128;let lastP=0;
  await new Promise(res=>{(function f(now){
    const t=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-t,2.2),x=x0+(x1-x0)*e;
    setPose(frig,x,560,1,0,-Math.abs(Math.sin((now-t0)/85))*(t<1?3:0),1.1);
    if(now-lastP>70&&t<.97){lastP=now;puff(fpuff,x-66,552,1,false);if(Math.random()<.3)speedLines(fpuff,x,548,1);}
    if(t<1)requestAnimationFrame(f);else res();})(performance.now());});
  svgEl.classList.remove('driving');
  squash(frig,[.86,1.14],[1.12,.9]);cartoon(fpuff,'TA-DA!',frig.x,470);
  for(let i=0;i<4;i++)puff(fpuff,frig.x+60,552,-1,true);
  sfx.bing();
  await sleep(500);
  $('#final').classList.add('open');sfx.chime();
  const r=$('#final').getBoundingClientRect();
  const cx=r.width*.5,cy=r.height*.45;
  confetti(host,cx,cy,60);setTimeout(()=>confetti(host,cx*.6,cy,40),500);setTimeout(()=>confetti(host,cx*1.4,cy,40),900);
  $('#final').classList.add('done');
  const fh=setInterval(()=>{if(scene!=='final'){clearInterval(fh);return;}floatHearts($('#final'),r.width,r.height);},800);
}
$('#noteBtn').onclick=()=>openModal('final');
$('#replayBtn').onclick=()=>{
  prog=0;cur=0;try{localStorage.removeItem(PKEY);}catch(e){}
  raiseMusic();enterMap();
};

/* ---------- arrow & edit bar ---------- */
arrow.onclick=()=>{
  showArrow(false);sfx.pop();
  if(scene==='bloom')runAge();
  else if(scene==='age')enterMap();
};
$('#nameIn').addEventListener('input',e=>{data.name=e.target.value.trim()||'';applyName();saveDraft();});
$('#bPrev').onclick=()=>{location.hash='#preview';location.reload();};
$('#bFinal').onclick=()=>{if(scene!=='final'){if(scene==='map'||scene==='age'||scene==='bloom'){} runFinal();}else openModal('final');};
$('#bExport').onclick=()=>{
  const json=JSON.stringify(data).replace(/</g,'\\u003c');
  const open='<script type="application/json" id="giftdata">';
  const i=SRC.indexOf(open),j=SRC.indexOf('<'+'/script>',i);
  const out=SRC.slice(0,i+open.length)+json+SRC.slice(j);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));
  a.download='birthday-site.html';document.body.appendChild(a);a.click();a.remove();
};
/* skip straight to scenes while editing */
if(EDIT){
  const sk=document.createElement('button');sk.textContent='Go to map';sk.style.cssText='';
  $('#bar').appendChild(sk);sk.onclick=()=>{initAudio();if(scene!=='map')enterMap();};
  sk.style.cssText='height:34px;border:2.5px solid #5b2a48;border-radius:17px;background:#fff;padding:0 12px;font-size:13px;font-family:inherit;color:#5b2a48';
}

/* ---------- init ---------- */
(async function(){
  if(hashMode!=='view'){const d=await idb.get('draft');if(d){data=d;data.levels=data.levels||{};data.final=data.final||{};}}
  if(!EDIT){try{prog=Math.min(NL,parseInt(localStorage.getItem(PKEY)||'0',10)||0);}catch(e){prog=0;}}
  cur=prog;
  $('#nameIn').value=data.name||'';
  applyName();
  if(hashMode==='preview'){const b=document.createElement('div');b.textContent='Preview';b.style.cssText='position:absolute;left:12px;top:12px;z-index:12;background:#fff;border:2.5px solid #5b2a48;border-radius:14px;padding:3px 10px;font-size:12px';$('#app').appendChild(b);}
  if(location.search.indexOf('map')>-1||location.hash==='#map'){}
  window.__bday={enterMap,runAge,runFinal,goTo,nodeTap,get state(){return {scene,prog,cur};}};
})();
})();
